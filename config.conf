# Configuration file for AI Vision Platform
# This file documents all configuration requirements

## Database Configuration (PostgreSQL)
DATABASE_TYPE=postgresql
DB_POOL_SIZE=10
DB_MAX_OVERFLOW=20
DB_ECHO=false

## API Configuration
API_HOST=0.0.0.0
API_PORT=8000
API_RELOAD=true

## CORS Configuration
CORS_ORIGINS=["*"]
CORS_CREDENTIALS=true
CORS_METHODS=["*"]
CORS_HEADERS=["*"]

## File Upload Configuration
UPLOAD_DIR=uploads
MAX_FILE_SIZE=52428800  # 50MB in bytes

## Model Configuration
MODEL_PATH=yolov8n.pt
MODEL_CONFIDENCE_THRESHOLD=0.5

## Logging Configuration
LOG_LEVEL=INFO
LOG_FORMAT=json
